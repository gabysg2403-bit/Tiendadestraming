        function pullAccountFromStockForReport(prodId) {
            const prod = storeData.products.find(p => p.id === prodId);
            if (!prod || !Array.isArray(prod.inventario)) {
                showToast("⚠️ No hay inventario en este servicio");
                return;
            }
            const nextFree = prod.inventario.find(a => !a.vendida);
            if (!nextFree) {
                showToast("⚠️ No quedan cuentas libres en el stock de " + prod.name + ". Puedes escribir una manualmente abajo.");
                return;
            }
            document.getElementById("res-stock-acc-id").value = nextFree.id;
            document.getElementById("res-stock-prod-id").value = prod.id;
            document.getElementById("res-new-email").value = nextFree.correo || "";
            document.getElementById("res-new-pass").value = nextFree.password || "";
            document.getElementById("res-new-perfil").value = nextFree.perfil || "";
            document.getElementById("res-new-id").value = nextFree.accountId || "";
            if (nextFree.codeGeneratorUrl) {
                document.getElementById("res-new-code-url").value = nextFree.codeGeneratorUrl;
            }
            showToast("⚡ Cuenta libre cargada del stock. Presiona Resolver para asignarla.");
        }

        function confirmResolveReportWithAccount(e, repId) {
            e.preventDefault();
            const rep = (storeData.reports || []).find(r => r.id === repId);
            if (!rep) return;

            const stockAccId = document.getElementById("res-stock-acc-id").value;
            const stockProdId = document.getElementById("res-stock-prod-id").value;
            const newEmail = document.getElementById("res-new-email").value.trim();
            const newPass = document.getElementById("res-new-pass").value.trim();
            const newPerfil = document.getElementById("res-new-perfil").value.trim();
            const newAccountId = document.getElementById("res-new-id").value.trim();
            const newCodeUrl = document.getElementById("res-new-code-url").value.trim();
            const adminMsg = document.getElementById("res-admin-msg").value.trim();

            const nowStr = new Date().toLocaleString("es-MX", {
                day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
            });

            // Si se tomó una cuenta del stock, marcarla como vendida/bloqueada para que no se venda a nadie más
            if (stockAccId && stockProdId) {
                const prod = storeData.products.find(p => p.id === stockProdId);
                if (prod && Array.isArray(prod.inventario)) {
                    const accObj = prod.inventario.find(a => a.id === stockAccId);
                    if (accObj && !accObj.vendida) {
                        accObj.vendida = true;
                        accObj.comprador = `Garantía / Reemplazo (${rep.buyerEmail || rep.accountEmail})`;
                        accObj.fechaEntrega = nowStr;
                    }
                }
            }

            const replacementObj = {
                id: "rep_acc_" + Date.now(),
                correo: newEmail,
                password: newPass,
                perfil: newPerfil,
                accountId: newAccountId,
                codeGeneratorUrl: newCodeUrl,
                isReplacement: true,
                fechaEntrega: nowStr
            };

            rep.status = "resuelto";
            rep.replacementAccount = replacementObj;
            rep.adminResponse = adminMsg;
            rep.resolvedDate = nowStr;

            // Actualizar también la compra del cliente en Mis Compras para que tenga la nueva cuenta lista
            let targetPurchaseId = rep.purchaseId || "";
            storeData.users.forEach(u => {
                if (Array.isArray(u.purchases)) {
                    let pur = u.purchases.find(p => p.id === rep.purchaseId);
                    if (!pur) {
                        pur = u.purchases.find(p => p.productName.toLowerCase() === rep.service.toLowerCase());
                    }
                    if (pur) {
                        targetPurchaseId = pur.id;
                        if (!Array.isArray(pur.deliveredAccounts)) pur.deliveredAccounts = [];
                        pur.deliveredAccounts.unshift(replacementObj);
                    }
                }
            });

            // Enviar NOTIFICACIÓN AL CLIENTE
            if (!storeData.clientNotifications) storeData.clientNotifications = [];
            storeData.clientNotifications.unshift({
                id: "cnotif_" + Date.now(),
                userEmail: rep.buyerEmail || (currentUser ? currentUser.email : ""),
                title: `✅ ¡Reporte resuelto! Nueva cuenta de ${rep.service}`,
                message: adminMsg || `Se te ha asignado una nueva cuenta de reemplazo para ${rep.service}.`,
                replacementSummary: `${newEmail} | ${newPass} ${newPerfil ? `| ${newPerfil}` : ""}`,
                reportId: rep.id,
                purchaseId: targetPurchaseId,
                date: nowStr,
                read: false
            });

            saveStoreData();
            playNotificationBellSound();
            renderApp();
            openAdminModal("reportes_admin");
            showToast("🎉 Reporte resuelto. El cliente ya recibió la notificación y su nueva cuenta.");
        }

        function togglePassVisibility(inputId) {
            const inp = document.getElementById(inputId);
            if (!inp) return;
            inp.type = inp.type === "password" ? "text" : "password";
        }

        function handleClientRegister(e) {
            e.preventDefault();
            const name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-pass").value;
            const countryCode = document.getElementById("reg-country").value;
            const whatsapp = document.getElementById("reg-phone").value.trim();

            let user = storeData.users.find(u => u.email.toLowerCase() === email.toLowerCase());
            if (!user) {
                user = {
                    id: "user_" + Date.now(),
                    name,
                    email,
                    password,
                    countryCode,
                    whatsapp,
                    balance: 0,
                    totalSpent: 0,
                    purchases: [],
                    movements: [],
                    references: []
                };
                storeData.users.push(user);
            } else {
                user.name = name;
                user.whatsapp = whatsapp;
            }

            setCurrentUser(user);
            saveStoreData();
            closeModal();
            currentView = "panel";
            currentPanelSection = "inicio";
            showToast(`🎉 ¡Bienvenido(a), ${name}!`);
            renderApp();
        }

        function handleClientLogin(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-pass").value;

            let user = storeData.users.find(u => u.email.toLowerCase() === email.toLowerCase());
            if (!user) {
                const namePart = email.split("@")[0] || "cliente";
                user = {
                    id: "user_" + Date.now(),
                    name: namePart,
                    email,
                    password,
                    countryCode: "+52 México",
                    whatsapp: "",
                    balance: 0,
                    totalSpent: 0,
                    purchases: [],
                    movements: [],
                    references: []
                };
                storeData.users.push(user);
            }

            setCurrentUser(user);
            saveStoreData();
            closeModal();
            currentView = "panel";
            currentPanelSection = "inicio";
            showToast(`👋 Hola de nuevo, ${user.name}`);
            renderApp();
        }

        function saveProductFromEditor(e) {
            e.preventDefault();
            const comboRaw = document.getElementById("pe-combo-services").value;
            const comboServices = comboRaw.split(",").map(s => s.trim()).filter(Boolean);
            const desiredStockVal = Math.max(0, parseInt(document.getElementById("pe-stock").value, 10) || 0);
            const codeGenUrl = document.getElementById("pe-code-url").value.trim();

            const newFieldConfig = {
                deliverAccount: document.getElementById("pe-deliver-account").checked,
                askClientEmail: document.getElementById("pe-ask-email").checked,
                askClientPassword: document.getElementById("pe-ask-pass").checked,
                askClientId: document.getElementById("pe-ask-id").checked,
                showAccountEmail: document.getElementById("pe-show-email").checked,
                showAccountPassword: document.getElementById("pe-show-pass").checked,
                showAccountProfile: document.getElementById("pe-show-profile").checked,
                showAccountId: document.getElementById("pe-show-id").checked,
                showCodeUrl: document.getElementById("pe-show-code-url").checked
            };

            const existingProd = editingProductId ? storeData.products.find(p => p.id === editingProductId) : null;
            let currentInv = (existingProd && Array.isArray(existingProd.inventario)) ? existingProd.inventario : [];

            if (newFieldConfig.deliverAccount) {
                const availableList = currentInv.filter(a => !a.vendida);
                const prodNameClean = document.getElementById("pe-name").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8) || "cuenta";
                if (desiredStockVal > availableList.length) {
                    const toAdd = desiredStockVal - availableList.length;
                    const extra = createInitialAccounts(prodNameClean, "juzax.shop", toAdd, 1000 + currentInv.length, codeGenUrl || DEFAULT_CODE_GENERATOR_URL);
                    currentInv = currentInv.concat(extra);
                } else if (desiredStockVal < availableList.length) {
                    let toRemove = availableList.length - desiredStockVal;
                    currentInv = currentInv.filter(a => {
                        if (!a.vendida && toRemove > 0) {
                            toRemove--;
                            return false;
                        }
                        return true;
                    });
                }
            }

            const prodData = {
                id: editingProductId || ("prod_" + Date.now()),
                name: document.getElementById("pe-name").value.trim(),
                categoryId: document.getElementById("pe-category").value,
                typeBadge: document.getElementById("pe-badge").value.trim() || "👤 Perfil",
                price: Math.max(0, parseFloat(document.getElementById("pe-price").value) || 0),
                unitLabel: document.getElementById("pe-unit").value.trim() || "/ perfil",
                stock: desiredStockVal,
                maxStock: Math.max(desiredStockVal, 20),
                screensText: document.getElementById("pe-screens").value.trim(),
                durationText: document.getElementById("pe-duration").value.trim(),
                warrantyText: document.getElementById("pe-warranty").value.trim(),
                featured: document.getElementById("pe-featured").checked,
                gradStart: document.getElementById("pe-grad-start").value,
                gradEnd: document.getElementById("pe-grad-end").value,
                image: document.getElementById("pe-image").value.trim(),
                watermarkEmoji: document.getElementById("pe-emoji").value.trim() || "🎬",
                comboServices: comboServices,
                codeGeneratorUrl: codeGenUrl,
                deliveryNote: document.getElementById("pe-delivery").value.trim(),
                fieldConfig: newFieldConfig,
                inventario: currentInv
            };

            if (editingProductId) {
                const idx = storeData.products.findIndex(p => p.id === editingProductId);
                if (idx !== -1) storeData.products[idx] = prodData;
            } else {
                storeData.products.unshift(prodData);
            }

            saveStoreData();
            renderApp();
            showToast("✅ Artículo y configuración de campos guardados");
            openAdminModal("productos");
        }

        function addBulkInventoryAccounts(prodId) {
            const prod = storeData.products.find(p => p.id === prodId);
            if (!prod) return;
            const raw = document.getElementById("inv-bulk-text").value.trim();
            const defaultCodeUrl = (document.getElementById("inv-code-url") ? document.getElementById("inv-code-url").value.trim() : "") || prod.codeGeneratorUrl || storeData.defaultCodeGeneratorUrl || DEFAULT_CODE_GENERATOR_URL;

            if (!raw) {
                showToast("⚠️ Pega al menos un renglón con correo | contraseña | perfil");
                return;
            }

            const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            let added = 0;
            if (!Array.isArray(prod.inventario)) prod.inventario = [];

            lines.forEach((line, idx) => {
                const parts = line.includes("|") ? line.split("|") : line.split(",");
                if (parts.length >= 2) {
                    const correo = parts[0].trim();
                    const password = parts[1].trim();
                    const perfil = (parts[2] ? parts[2].trim() : "Perfil Completo");
                    const customUrl = (parts[3] ? parts[3].trim() : defaultCodeUrl);
                    if (correo && password) {
                        prod.inventario.push({
                            id: "acc_" + Date.now() + "_" + idx,
                            correo,
                            password,
                            perfil,
                            codeGeneratorUrl: customUrl,
                            vendida: false,
                            comprador: null,
                            fechaEntrega: null
                        });
                        added++;
                    }
                }
            });

            saveStoreData();
            renderApp();
            openAdminModal("cuentas");
            showToast(`📥 Se agregaron ${added} cuentas al stock de ${prod.name}`);
        }

        function approvePendingRecharge(reqIdx) {
            const req = storeData.rechargeRequests[reqIdx];
            if (!req || req.status === "Aprobada") return;
            req.status = "Aprobada";

            const amountToCredit = Number(req.amount || 0);
            const u = storeData.users.find(user => user.email.toLowerCase() === req.userEmail.toLowerCase());
            if (u) {
                u.balance = Number(u.balance || 0) + amountToCredit;
                if (Array.isArray(u.references)) {
                    const refMatch = u.references.find(r => r.id === req.id);
                    if (refMatch) refMatch.status = "Aprobada";
                }
                if (!u.movements) u.movements = [];
                u.movements.unshift({
                    id: "mov_" + Date.now(),
                    concept: `Recarga aprobada (Ref. ${req.code})`,
                    date: new Date().toLocaleDateString("es-MX"),
                    amount: amountToCredit
                });
            }

            saveStoreData();
            renderApp();
            openAdminModal("recargas");
            showToast(`✅ Recarga de $${amountToCredit} abonada a ${req.userName}`);
        }

            req.status = "Rechazada";
            const u = storeData.users.find(user => user.email.toLowerCase() === req.userEmail.toLowerCase());

        function generateUpdatedHtmlSource() {
            let docHtml = document.documentElement.outerHTML;
            const serialized = JSON.stringify(storeData, null, 4);
            const regex = /const INITIAL_STORE_DATA = \{[\s\S]*?\n        \};/;
            docHtml = docHtml.replace(regex, `const INITIAL_STORE_DATA = ${serialized};`);
            return "<!DOCTYPE html>\n" + docHtml;
        }

        function exportUpdatedHtmlFile() {
            const fullHtml = generateUpdatedHtmlSource();
            const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "index.html";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("📥 Archivo index.html descargado");
        }

        function copyUpdatedHtmlCode() {
            const fullHtml = generateUpdatedHtmlSource();
            const temp = document.createElement("textarea");
            temp.value = fullHtml;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
            showToast("📋 Código HTML copiado al portapapeles");
        }

        /* =========================================================================
           22. REPRODUCTOR DE MÚSICA (SOPORTA MP3 Y SINTETIZADOR AMBIENTAL INTEGRADO)
           ========================================================================= */
        let isMusicPlaying = false;
        let currentTrackIndex = 0;
        let htmlAudioPlayer = new Audio();
        let synthInterval = null;
        let audioCtx = null;

        function togglePlaylistPopup() {
            const box = document.getElementById("floating-playlist-box");
            if (box) box.classList.toggle("hidden");
        }

        function renderFloatingPlaylist() {
            const container = document.getElementById("floating-playlist-items");
            const btn = document.getElementById("music-play-btn");
            if (btn) btn.textContent = isMusicPlaying ? "⏸" : "▶";
            if (!container) return;

            if (!storeData.songs || storeData.songs.length === 0) {
                container.innerHTML = `<div class="text-gray-500 py-2">Sin canciones</div>`;
                return;
            }

            container.innerHTML = storeData.songs.map((s, idx) => `
                <button onclick="playSpecificTrack(${idx})" class="w-full text-left px-2.5 py-1.5 rounded-lg flex items-center justify-between ${idx === currentTrackIndex ? 'bg-white/15 text-white font-bold' : 'text-gray-300 hover:bg-white/5'}">
                    <span class="truncate">${escapeHtml(s.title)}</span>
                    <span>${idx === currentTrackIndex && isMusicPlaying ? '🔊' : '▶'}</span>
                </button>
            `).join("");
        }

        function toggleMusicPlay() {
            if (isMusicPlaying) {
                stopAllMusic();
            } else {
                playSpecificTrack(currentTrackIndex);
            }
        }

        function nextMusicTrack() {
            if (!storeData.songs || storeData.songs.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % storeData.songs.length;
            playSpecificTrack(currentTrackIndex);
        }

        function stopAllMusic() {
            isMusicPlaying = false;
            htmlAudioPlayer.pause();
            if (synthInterval) {
                clearInterval(synthInterval);
                synthInterval = null;
            }
            renderFloatingPlaylist();
            if (currentPanelSection === "musica") renderApp();
        }

        function playSpecificTrack(idx) {
            if (!storeData.songs || !storeData.songs[idx]) return;
            stopAllMusic();
            currentTrackIndex = idx;
            const track = storeData.songs[idx];
            isMusicPlaying = true;

            if (track.url && !track.url.startsWith("synth_")) {
                htmlAudioPlayer.src = track.url;
                htmlAudioPlayer.play().catch(() => {
                    startAmbientSynth(idx);
                });
                htmlAudioPlayer.onended = () => nextMusicTrack();
            } else {
                startAmbientSynth(idx);
            }

            showToast(`🎵 Reproduciendo: ${track.title}`);
            renderFloatingPlaylist();
            if (currentPanelSection === "musica") renderApp();
        }

        function startAmbientSynth(seedIdx) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === "suspended") audioCtx.resume();

                const chords = [
                    [220, 261.63, 329.63, 392],
                    [196, 246.94, 293.66, 369.99],
                    [174.61, 220, 261.63, 349.23]
                ];
                let step = 0;
                const playNote = () => {
                    if (!isMusicPlaying) return;
                    const chord = chords[(step + seedIdx) % chords.length];
                    const freq = chord[step % chord.length];
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.035, audioCtx.currentTime + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.45);
                    step++;
                };
                playNote();
                synthInterval = setInterval(playNote, 650);
            } catch (e) {}
        }

        /* =========================================================================
           23. EFECTO DE TEXTO EN TIEMPO REAL Y CANVAS DE ESTRELLAS FUGACES
           ========================================================================= */
        let typingTimer = null;
        function startTypingEffect() {
            clearInterval(typingTimer);
            const el = document.getElementById("typing-product-name");
            if (!el) return;
            const names = storeData.products.filter(p => Number(p.stock) > 0).map(p => p.name);
            const list = names.length > 0 ? names : ["Netflix", "Disney", "Crunchyroll", "Prime Video"];
            let wordIdx = 0;
            let charIdx = list[0].length;
            let deleting = true;

            typingTimer = setInterval(() => {
                const target = document.getElementById("typing-product-name");
                if (!target) {
                    clearInterval(typingTimer);
                    return;
                }
                const currentWord = list[wordIdx % list.length];
                if (deleting) {
                    charIdx--;
                    target.textContent = currentWord.substring(0, charIdx);
                    if (charIdx <= 0) {
                        deleting = false;
                        wordIdx = (wordIdx + 1) % list.length;
                    }
                } else {
                    const nextWord = list[wordIdx % list.length];
                    charIdx++;
                    target.textContent = nextWord.substring(0, charIdx);
                    if (charIdx >= nextWord.length) {
                        deleting = true;
                    }
                }
            }, 180);
        }

        function initStarsCanvas() {
            const canvas = document.getElementById("stars-canvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const stars = Array.from({ length: 45 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 1.3 + 0.4,
                alpha: Math.random() * 0.7 + 0.2,
                speed: Math.random() * 0.15 + 0.04
            }));

            let shootingStar = {
                x: width * 0.8,
                y: height * 0.1,
                vx: -4.5,
                vy: 4.5,
                len: 75,
                active: true,
                wait: 0
            };

            function draw() {
                ctx.clearRect(0, 0, width, height);

                for (const s of stars) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                    ctx.fill();
                    s.y -= s.speed;
                    if (s.y < 0) s.y = height;
                }

                if (shootingStar.active) {
                    const grad = ctx.createLinearGradient(
                        shootingStar.x, shootingStar.y,
                        shootingStar.x - shootingStar.vx * 14, shootingStar.y - shootingStar.vy * 14
                    );
                    grad.addColorStop(0, "rgba(255,255,255,0.95)");
                    grad.addColorStop(1, "rgba(255,255,255,0)");

                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(shootingStar.x, shootingStar.y);
                    ctx.lineTo(shootingStar.x - shootingStar.vx * 12, shootingStar.y - shootingStar.vy * 12);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(shootingStar.x, shootingStar.y, 2.4, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();

                    shootingStar.x += shootingStar.vx;
                    shootingStar.y += shootingStar.vy;

                    if (shootingStar.x < -100 || shootingStar.y > height + 100) {
                        shootingStar.active = false;
                        shootingStar.wait = 90;
                    }
                } else {
                    shootingStar.wait--;
                    if (shootingStar.wait <= 0) {
                        shootingStar.x = Math.random() * (width * 0.7) + width * 0.3;
                        shootingStar.y = Math.random() * (height * 0.35);
                        shootingStar.active = true;
                    }
                }

                requestAnimationFrame(draw);
            }
            draw();
        }

        /* =========================================================================
           24. UTILIDADES DE MODALES Y ESCAPE HTML
           ========================================================================= */
        function showModal(htmlContent) {
            const container = document.getElementById("modal-container");
            if (!container) return;
            container.innerHTML = htmlContent;
            container.classList.remove("hidden");
            container.classList.add("flex");
        }

        function closeModal() {
            const container = document.getElementById("modal-container");
            if (!container) return;
            container.classList.add("hidden");
            container.classList.remove("flex");
            container.innerHTML = "";
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* =========================================================================
           25. INICIALIZACIÓN AL CARGAR LA PÁGINA
           ========================================================================= */
        window.onload = function() {
            initStarsCanvas();
            renderApp();
        };
    </script>
