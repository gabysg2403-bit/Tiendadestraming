    <style>
        :root {
            --bg-main: #07080c;
            --bg-card: #11131a;
            --bg-card-inner: #171923;
            --border-color: rgba(255, 255, 255, 0.09);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-btn: #ffffff;
            --accent-btn-text: #090a0f;
            --bg-overlay-opacity: 0.78;
        }

        body.light-mode {
            --bg-main: #f4f5f8;
            --bg-card: #ffffff;
            --bg-card-inner: #f1f5f9;
            --border-color: rgba(0, 0, 0, 0.09);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-btn: #0f172a;
            --accent-btn-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Fondo personalizado y canvas de estrellas */
        #wallpaper-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.3s ease;
        }

        #wallpaper-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: var(--bg-main);
            opacity: var(--bg-overlay-opacity);
            transition: background-color 0.25s ease, opacity 0.25s ease;
        }

        #stars-canvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* Tarjetas y contenedores */
        .store-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 22px;
        }

        .store-card-inner {
            background-color: var(--bg-card-inner);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .btn-primary-pill {
            background-color: var(--accent-btn);
            color: var(--accent-btn-text);
            font-weight: 700;
            border-radius: 16px;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn-primary-pill:active {
            transform: scale(0.97);
        }

        .btn-secondary-pill {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-weight: 600;
            border-radius: 16px;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        body.light-mode .btn-secondary-pill {
            background-color: rgba(0, 0, 0, 0.04);
        }

        /* Ocultar barra de scroll en carruseles horizontales */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animación de radar en portada */
        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(59, 130, 246, 0.35); }
            50% { box-shadow: 0 0 45px rgba(96, 165, 250, 0.65); }
        }
        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .orbit-ring {
            animation: orbitSpin 14s linear infinite;
        }
        .logo-glow {
            animation: pulseGlow 3.5s ease-in-out infinite;
        }
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: currentColor;
            vertical-align: middle;
            margin-left: 2px;
            animation: blinkCursor 0.8s infinite;
        }

        /* Marquee infinito en portada */
        @keyframes marqueeScroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .marquee-track {
            display: flex;
            width: max-content;
            animation: marqueeScroll 22s linear infinite;
        }

        /* Encabezado de tarjeta de producto */
        .product-banner {
            position: relative;
            height: 118px;
            border-radius: 18px;
            overflow: hidden;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-watermark {
            position: absolute;
            right: -6px;
            bottom: -10px;
            width: 105px;
            height: 105px;
            object-fit: contain;
            opacity: 0.24;
            pointer-events: none;
            transform: rotate(-8deg);
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }

        /* Inputs estilizados */
        .store-input {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 13px 15px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        body.light-mode .store-input {
            background-color: #f8fafc;
        }
        .store-input:focus {
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
        }
        body.light-mode .store-input:focus {
            border-color: #0f172a;
        }

        /* Modal backdrop */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
        }
    </style>
</head>

        // Sincroniza el número de stock disponible de cada producto con sus cuentas NO vendidas
        // (Excepto los productos de sincronización manual como Canva, que usan su propio contador de cupos)
        function syncAllProductsStockWithInventory() {
            if (!storeData || !Array.isArray(storeData.products)) return;
            storeData.products.forEach(p => {
                if (!p.fieldConfig) {
                    p.fieldConfig = { ...DEFAULT_FIELD_CONFIG };
                }
                if (!Array.isArray(p.inventario)) {
                    p.inventario = [];
                }
                if (p.fieldConfig.deliverAccount !== false) {
                    const availableCount = p.inventario.filter(acc => !acc.vendida).length;
                    p.stock = availableCount;
                } else {
                    p.stock = Math.max(0, Number(p.stock) || 0);
                }
            });
        }

            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const merged = Object.assign({}, INITIAL_STORE_DATA, parsed);
                    if (!merged.rechargeRequests) merged.rechargeRequests = [];
                    if (!merged.adminNotifications) merged.adminNotifications = [];
                    if (!merged.clientNotifications) merged.clientNotifications = [];
                    if (!merged.manualSyncOrders) merged.manualSyncOrders = [];
                    if (!merged.reports) merged.reports = [];
                    if (!merged.defaultCodeGeneratorUrl) merged.defaultCodeGeneratorUrl = DEFAULT_CODE_GENERATOR_URL;
                    if (merged.products && Array.isArray(merged.products)) {
                        merged.products.forEach(p => {
                            p.fieldConfig = Object.assign({}, DEFAULT_FIELD_CONFIG, p.fieldConfig || {});
                            if (p.codeGeneratorUrl === undefined) p.codeGeneratorUrl = merged.defaultCodeGeneratorUrl;
                            if (!Array.isArray(p.inventario)) {
                                if (p.fieldConfig.deliverAccount !== false) {
                                    p.inventario = createInitialAccounts(
                                        p.name.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8) || "cuenta",
                                        "juzax.shop",
                                        Math.max(0, Number(p.stock) || 0),
                                        1500,
                                        p.codeGeneratorUrl
                                    );
                                } else {

                                }
                            }
                        });
                    }
                    return merged;
                }

        function playNotificationBellSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "triangle";
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12); // A5
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.56);
            } catch (e) {}
        }

        /* =========================================================================
           4. COMPRESOR DE IMÁGENES PARA SUBIDA DESDE EL CELULAR (SIN ERRORES)
           ========================================================================= */
        function compressImageFromFile(file, maxWidth = 900, quality = 0.78) {
            return new Promise((resolve, reject) => {
                if (!file) return reject("No file");
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement("canvas");
                        let w = img.width;
                        let h = img.height;
                        if (w > maxWidth) {
                            h = Math.round((h * maxWidth) / w);
                            w = maxWidth;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL("image/jpeg", quality);
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = evt.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

                    <!-- Derecha: Píldora Saldo + Campana + Sol/Tema + Candado Admin + Salir -->
                    <div class="flex items-center gap-1.5 sm:gap-2">
                        <!-- Píldora de Saldo -->
                        <button onclick="navigateSection('recargar')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-sm font-extrabold" style="background-color: var(--bg-card); border-color: var(--border-color);">
                            <span class="w-5 h-5 rounded-full bg-white text-black flex items-center justify-center text-xs font-black border border-black/10">$</span>
                            <span>$${balanceVal}</span>

                        <!-- Campana de Notificaciones (Muestra alertas al cliente cuando le resuelven un reporte + alertas a la Admin) -->
                        <div class="relative">
                            <button onclick="toggleNotifications()" class="relative w-10 h-10 rounded-full border flex items-center justify-center text-base hover:bg-white/5 transition" style="background-color: var(--bg-card); border-color: var(--border-color);">
                                🔔
                                ${(unreadClientNotifs > 0 || totalAdminPending > 0) ? `
                                    <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-rose-500 text-white text-[10px] font-black flex items-center justify-center shadow animate-bounce">
                                        ${unreadClientNotifs > 0 ? unreadClientNotifs : totalAdminPending}
                                    </span>
                                ` : ""}
                            </button>

                            ${showNotificationsDropdown ? `
                                <div class="absolute right-0 mt-2 w-80 sm:w-96 p-4 rounded-2xl shadow-2xl border z-50 text-xs space-y-2.5 max-h-[78vh] overflow-y-auto" style="background-color: var(--bg-card); border-color: var(--border-color);">
                                    <div class="flex items-center justify-between">
                                        <span class="font-extrabold uppercase tracking-wider text-gray-400">NOTIFICACIONES</span>
                                        <button onclick="toggleNotifications()" class="text-gray-400 hover:text-white">✕</button>
                                    </div>

                                    <!-- Notificaciones para el CLIENTE (Ej. Reporte de falla resuelto con nueva cuenta o Sincronización completada) -->
                                    ${myClientNotifs.length > 0 ? `
                                        <div class="space-y-2">
                                            <div class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-400">Avisos de tu cuenta</div>
                                            ${myClientNotifs.slice(0, 8).map(cn => `
                                                <div onclick="openClientNotificationTarget('${cn.id}')" class="p-3 rounded-xl border cursor-pointer transition ${cn.read ? 'border-white/10 bg-white/[0.02]' : 'border-emerald-400/50 bg-emerald-500/10'}">
                                                    <div class="flex items-center justify-between gap-2">
                                                        <span class="font-black text-emerald-300">${escapeHtml(cn.title)}</span>
                                                        ${!cn.read ? `<span class="px-1.5 py-0.5 rounded bg-emerald-400 text-black text-[9px] font-black">NUEVO</span>` : ""}
                                                    </div>
                                                    <div class="text-gray-300 text-[11px] mt-1 leading-relaxed">${escapeHtml(cn.message)}</div>
                                                    ${cn.replacementSummary ? `
                                                        <div class="mt-2 p-2 rounded-lg bg-black/40 border border-emerald-500/30 font-mono text-[11px] text-amber-300">
                                                            ${escapeHtml(cn.replacementSummary)}
                                                        </div>
                                                    ` : ""}
                                                    <div class="text-[10px] text-emerald-400 font-bold mt-1.5 underline">Toca para ver tu cuenta →</div>
                                                </div>
                                            `).join("")}
                                        </div>
                                    ` : ""}

                                    <!-- Alertas para la ADMINISTRADORA (Recargas, Reportes de falla o Sincronizaciones manuales) -->
                                    ${totalAdminPending > 0 ? `
                                        <div class="p-3 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-300 space-y-2">
                                            <div class="font-bold">🛠️ Panel Administradora (${totalAdminPending} pendiente${totalAdminPending > 1 ? 's' : ''}):</div>
                                            ${pendingRecharges > 0 ? `<div class="text-[11px]">• 💳 ${pendingRecharges} recarga(s) esperando aprobación manual.</div>` : ""}
                                            ${pendingReports > 0 ? `<div class="text-[11px]">• ⚠️ ${pendingReports} reporte(s) de falla por resolver.</div>` : ""}
                                            ${pendingSyncs > 0 ? `<div class="text-[11px]">• 🖐️ ${pendingSyncs} sincronización(es) manual(es) (ej. Canva).</div>` : ""}
                                            <div class="grid grid-cols-2 gap-1.5 pt-1">
                                                <button onclick="showNotificationsDropdown=false; isAdminUnlocked ? openAdminModal('recargas') : promptAdminUnlock();" class="py-1.5 px-2 rounded-lg bg-amber-400 text-black font-black text-[11px]">
                                                    Ver Recargas
                                                </button>
                                                <button onclick="showNotificationsDropdown=false; isAdminUnlocked ? openAdminModal('reportes_admin') : promptAdminUnlock();" class="py-1.5 px-2 rounded-lg bg-rose-400 text-black font-black text-[11px]">
                                                    Ver Reportes/Sync
                                                </button>
                                            </div>
                                        </div>
                                    ` : ""}

                                    ${(myClientNotifs.length === 0 && totalAdminPending === 0) ? `
                                        <div class="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/25 text-amber-300">
                                            🔔 Aquí te avisaremos en cuanto se resuelva un reporte de falla o se active tu recarga.
                                        </div>
                                        <div class="text-gray-400 py-1">Sin novedades por ahora.</div>
                                    ` : ""}
                                </div>
                            ` : ""}
                        </div>

                        <!-- Botón Sol / Luna (Cambio de tema Claro / Oscuro igual al final del video 02:55) -->
                        <button onclick="toggleLightDarkMode()" title="Cambiar tema claro/oscuro" class="w-10 h-10 rounded-full border flex items-center justify-center text-base hover:bg-white/5 transition" style="background-color: var(--bg-card); border-color: var(--border-color);">
                            ☀️
                        </button>

                        <!-- Botón discreto de Modo Administradora -->
                        <button onclick="promptAdminUnlock()" title="Modo Administradora" class="relative w-9 h-9 rounded-full border flex items-center justify-center text-xs hover:bg-white/5 transition" style="background-color: var(--bg-card); border-color: var(--border-color);">
                            🔒
                            ${totalAdminPending > 0 ? `<span class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-rose-500"></span>` : ""}
                        </button>

                        <!-- Botón Salir -->
                        <button onclick="logoutUser()" class="px-3.5 py-2 rounded-full border text-xs sm:text-sm font-bold hover:bg-white/5 transition" style="background-color: var(--bg-card); border-color: var(--border-color);">
                            Salir
                        </button>
                    </div>
                </header>

                <!-- Banner de aviso rápido si el cliente tiene un reporte recién resuelto sin leer -->
                ${unreadClientNotifs > 0 ? `
                    <div class="mx-4 mt-3 p-3.5 rounded-2xl bg-emerald-500/20 border border-emerald-400/50 text-emerald-200 text-xs flex items-center justify-between gap-3 shadow-lg">
                        <div class="flex items-center gap-2">
                            <span class="text-lg">🎁</span>
                            <div>
                                <div class="font-black text-emerald-300">¡Tienes una actualización en tu cuenta!</div>
                                <div class="text-[11px]">Se resolvió tu reporte o sincronización y tu cuenta ya está lista.</div>
                            </div>
                        </div>
                        <button onclick="openLatestClientNotification()" class="px-3 py-2 rounded-xl bg-emerald-400 text-black font-black shrink-0 text-xs shadow">
                            Ver Nueva Cuenta →
                        </button>
                    </div>
                ` : ""}

                <!-- Contenido dinámico según la sección elegida -->
                <main class="px-4 pt-5 pb-16">
                    ${renderActivePanelSection()}
                </main>
            `;
        }

        function renderActivePanelSection() {
            switch (currentPanelSection) {
                case "inicio": return renderSectionInicio();
                case "tienda": return renderSectionTienda();
                case "recargar": return renderSectionRecargar();
                case "compras": return renderSectionCompras();
                case "entrega": return renderSectionEntregaCuenta();
                case "reportes": return renderSectionReportes();
                case "avisos": return renderSectionAvisos();
                case "musica": return renderSectionMusica();
                case "juegos": return renderSectionJuegos();
                case "movimientos": return renderSectionMovimientos();
                case "micuenta": return renderSectionMiCuenta();
                default: return renderSectionInicio();
            }
        }

        /* =========================================================================
           9. APARTADO: INICIO DEL PANEL DE CLIENTE (00:20 - 00:34)
           ========================================================================= */
        function renderSectionInicio() {
            const userName = currentUser ? currentUser.name : "cliente";
            const userEmail = currentUser ? currentUser.email : "tucorreo@gmail.com";
            const balance = currentUser ? Number(currentUser.balance || 0) : 0;
            const spent = currentUser ? Number(currentUser.totalSpent || 0) : 0;
            const purchasesCount = currentUser ? (currentUser.purchases ? currentUser.purchases.length : 0) : 0;
            const featuredProducts = storeData.products.filter(p => p.featured);
            const movements = (currentUser && currentUser.movements) ? currentUser.movements : [];

            return `
                <div class="space-y-5">
                    <!-- Saludo principal -->
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-black">Hola, ${escapeHtml(userName)}</h1>
                        <p class="text-sm text-gray-400 mt-1">Esto es lo que pasa en tu cuenta de ${escapeHtml(storeData.storeName)}.</p>
                    </div>

                    <!-- Botón Ir a la tienda -->
                    <div>
                        <button onclick="navigateSection('tienda')" class="btn-primary-pill inline-flex items-center gap-2 px-5 py-3 text-sm font-extrabold shadow">
                            <span>🛍️</span>
                            <span>Ir a la tienda</span>
                        </button>
                    </div>

                    <!-- Aviso de vincular saldo con WhatsApp -->
                    <div class="p-4 rounded-2xl border text-xs sm:text-sm leading-relaxed" style="background-color: rgba(245, 158, 11, 0.06); border-color: rgba(245, 158, 11, 0.28);">
                        <span>🔗 </span>
                        <span class="font-bold">Une tu saldo con WhatsApp.</span>
                        <span class="text-gray-400"> Escribe </span>
                        <code class="px-2 py-0.5 rounded bg-white/10 font-mono text-xs">.correo ${escapeHtml(userEmail)}</code>
                        <span class="text-gray-400"> en el grupo de la tienda y confirma el correo que te llega.</span>
                    </div>

                    <!-- Tarjetas de resumen: Saldo disponible, Total gastado, Compras -->
                    <div class="grid grid-cols-2 gap-3">
                        <div onclick="navigateSection('recargar')" class="store-card p-4 cursor-pointer hover:border-white/25 transition">
                            <div class="text-xs text-gray-400 flex items-center gap-1.5 mb-2">
                                <span>💰</span>
                                <span>Saldo disponible</span>
                            </div>
                            <div class="text-3xl font-black mb-2">$${balance}</div>
                            <div class="text-xs text-gray-400 leading-snug">
                                El mismo saldo en web y WhatsApp <span class="font-bold underline">Recargar →</span>
                            </div>
                        </div>

                        <div class="store-card p-4 flex flex-col justify-between">
                            <div>
                                <div class="text-xs text-gray-400 flex items-center gap-1.5 mb-2">
                                    <span>📉</span>
                                    <span>Total gastado</span>
                                </div>
                                <div class="text-3xl font-black mb-2">$${spent}</div>
                            </div>
                            <div class="text-xs text-gray-400">Desde que te registraste</div>
                        </div>

                        <div onclick="navigateSection('compras')" class="store-card p-4 cursor-pointer">
                            <div class="text-xs text-gray-400 flex items-center gap-1.5 mb-2">
                                <span>📦</span>
                                <span>Compras</span>
                            </div>
                            <div class="text-3xl font-black mb-1">${purchasesCount}</div>
                            <div class="text-xs text-gray-400">${purchasesCount === 0 ? "Aún no compras" : "Ver mis cuentas →"}</div>
                        </div>
                    </div>

                    <!-- Bloque Recomendados -->
                    <div class="store-card p-4 space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-lg font-extrabold">Recomendados</h2>
                            <button onclick="navigateSection('tienda')" class="text-xs font-semibold text-gray-400 hover:text-white">Ver todo →</button>
                        </div>
                        <div class="space-y-4">
                            ${(featuredProducts.length > 0 ? featuredProducts.slice(0, 3) : storeData.products.slice(0, 2)).map(prod => renderProductCard(prod)).join("")}
                        </div>
                    </div>

                    <!-- Bloque Últimos movimientos -->
                    <div class="store-card p-4">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-extrabold">Últimos movimientos</h2>
                            <button onclick="navigateSection('movimientos')" class="text-xs font-semibold text-gray-400 hover:text-white">Ver todos →</button>
                        </div>
                        ${movements.length === 0 ? `
                            <div class="py-8 text-center">
                                <div class="text-4xl mb-2">🧾</div>
                                <div class="font-bold text-base">Sin movimientos</div>
                                <div class="text-xs text-gray-400 mt-0.5">Aquí verás recargas y compras.</div>
                            </div>
                        ` : `
                            <div class="space-y-2.5">
                                ${movements.slice(0, 4).map(m => `
                                    <div class="store-card-inner p-3 flex items-center justify-between text-xs">
                                        <div>
                                            <div class="font-bold">${escapeHtml(m.concept)}</div>
                                            <div class="text-gray-400 text-[11px]">${escapeHtml(m.date)}</div>
                                        </div>
                                        <div class="font-extrabold text-sm ${m.amount >= 0 ? 'text-emerald-400' : ''}">
                                            ${m.amount >= 0 ? '+' : ''}$${m.amount}
                                        </div>
                                    </div>
                                `).join("")}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        /* =========================================================================
           10. APARTADO: TIENDA Y TARJETAS DE PRODUCTO (00:35 - 01:33)
           ========================================================================= */
        function renderSectionTienda() {
            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-black">Tienda</h1>
                            <p class="text-xs sm:text-sm text-gray-400 mt-0.5">Precios y stock en tiempo real. Al comprar ves tus accesos aquí mismo.</p>
                        </div>
                        ${isAdminUnlocked ? `
                            <button onclick="openProductEditor(null)" class="bg-emerald-500 text-black font-extrabold text-xs px-3.5 py-2 rounded-xl shadow shrink-0">
                                + Nuevo Producto
                            </button>
                        ` : ""}
                    </div>

                    ${renderCatalogBlock()}
                </div>
            `;
        }

        function renderCatalogBlock() {
            const filtered = storeData.products.filter(p => {
                const matchCat = selectedCategory === "todos" || p.categoryId === selectedCategory;
                const q = searchQuery.trim().toLowerCase();
                const matchSearch = !q || p.name.toLowerCase().includes(q) || (p.screensText && p.screensText.toLowerCase().includes(q)) || (p.comboServices && p.comboServices.join(" ").toLowerCase().includes(q));
                return matchCat && matchSearch;
            });

            return `
                <!-- Buscador -->
                <div class="relative mb-3">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
                    <input
                        type="text"
                        value="${escapeHtml(searchQuery)}"
                        oninput="handleSearchInput(this.value)"
                        placeholder="Buscar por nombre o plataforma..."
                        class="store-input pl-11 pr-4 py-3.5 rounded-2xl text-sm"
                    >
                </div>

                <!-- Barra horizontal de Categorías con soporte de Imagen e Icono -->
                <div class="store-card p-1.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar mb-5">
                    ${storeData.categories.map(cat => {
                        const isActive = selectedCategory === cat.id;
                        return `
                            <button
                                onclick="selectCategory('${cat.id}')"
                                class="flex items-center gap-2 px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold whitespace-nowrap transition shrink-0 ${isActive ? 'bg-white/15 shadow' : 'text-gray-400 hover:text-white'}"
                            >
                                ${cat.image ? `<img src="${cat.image}" class="w-5 h-5 rounded-full object-cover" alt="">` : (cat.icon ? `<span>${cat.icon}</span>` : "")}
                                <span>${escapeHtml(cat.name)}</span>
                            </button>
                        `;
                    }).join("")}
                    ${isAdminUnlocked ? `
                        <button onclick="openAdminModal('categorias')" class="px-3 py-2 rounded-xl bg-emerald-500/20 text-emerald-400 text-xs font-bold shrink-0">
                            + Categorías
                        </button>
                    ` : ""}
                </div>

                <!-- Lista de tarjetas de productos o estado vacío -->
                ${filtered.length === 0 ? `
                    <div class="py-14 text-center">
                        <div class="text-5xl mb-3">🔍</div>
                        <div class="text-lg font-extrabold">Sin resultados</div>
                        <p class="text-xs text-gray-400 mt-1">Prueba con otra palabra o cambia el filtro.</p>
                    </div>
                ` : `
                    <div class="space-y-4">
                        ${filtered.map(prod => renderProductCard(prod)).join("")}
                    </div>
                `}
            `;
        }

        function renderProductCard(prod) {
            const stock = Math.max(0, Number(prod.stock) || 0);
            const maxStock = Math.max(stock, Number(prod.maxStock) || 20, 1);
            const pct = stock === 0 ? 0 : Math.min(100, Math.max(12, Math.round((stock / maxStock) * 100)));
            const qty = cardQuantities[prod.id] || 1;

            // Determinar estado Disponible / Últimos / Agotado
            let statusLabel = "Disponible";
            let statusColor = "text-emerald-400";
            let barColor = "bg-emerald-400";
            if (stock === 0) {
                statusLabel = "Agotado";
                statusColor = "text-rose-400";
                barColor = "bg-rose-500";
            } else if (stock <= 5) {
                statusLabel = "Últimos";
                statusColor = "text-amber-400";
                barColor = "bg-amber-400";
            }

            const isCombo = prod.categoryId === "combos" || (prod.unitLabel && prod.unitLabel.includes("combo"));
            const stockUnitWord = isCombo ? "combos" : "perfiles";
            const catObj = storeData.categories.find(c => c.id === prod.categoryId);

            return `
                <div class="store-card p-2.5 sm:p-3 shadow-xl transition hover:border-white/20">
                    <!-- ENCABEZADO CON DEGRADADO DE COLOR PERSONALIZABLE -->
                    <div class="product-banner" style="background: linear-gradient(135deg, ${prod.gradStart || '#1d4ed8'} 0%, ${prod.gradEnd || '#0f172a'} 100%);">
                        <!-- Marca de agua o Imagen personalizada del producto -->
                        ${prod.image ? `
                            <img src="${prod.image}" class="product-watermark !opacity-75 !rotate-0 rounded-xl object-cover" alt="${escapeHtml(prod.name)}">
                        ` : `
                            <div class="product-watermark flex items-center justify-center text-7xl select-none">
                                ${prod.watermarkEmoji || "🎬"}
                            </div>
                        `}

                        <!-- Fila superior de insignias dentro del banner -->
                        <div class="relative z-10 flex items-center justify-between gap-2">
                            <div>
                                ${prod.featured ? `
                                    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold bg-black/45 text-amber-300 backdrop-blur-md border border-white/10">
                                        ★ Destacado
                                    </span>
                                ` : `<span></span>`}
                            </div>
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-black/40 text-white backdrop-blur-md border border-white/10">
                                ${catObj && catObj.image ? `<img src="${catObj.image}" class="w-3.5 h-3.5 rounded-full object-cover">` : ""}
                                <span>${escapeHtml(prod.typeBadge || "👤 Perfil")}</span>
                            </span>
                        </div>

                        <!-- Nombre grande del servicio -->
                        <h3 class="relative z-10 text-2xl sm:text-[26px] font-black text-white tracking-tight drop-shadow">
                            ${escapeHtml(prod.name)}
                        </h3>
                    </div>

                    <!-- CUERPO DE LA TARJETA -->
                    <div class="px-2 pt-3.5 pb-1.5 space-y-3">
                        <!-- Línea de detalles: Pantallas · Duración · Garantía -->
                        <div class="text-xs sm:text-[13px] text-gray-400 leading-relaxed flex flex-wrap items-center gap-x-1.5 gap-y-1">
                            <span>${escapeHtml(prod.screensText || "Cuentas completas")}</span>
                            ${prod.durationText ? `<span>· 📅 ${escapeHtml(prod.durationText)}</span>` : ""}
                            ${prod.warrantyText ? `<span>· 🛡️ ${escapeHtml(prod.warrantyText)}</span>` : ""}
                        </div>

                        <!-- Píldoras de servicios incluidos si es un Combo -->
                        ${prod.comboServices && prod.comboServices.length > 0 ? `
                            <div class="flex flex-wrap gap-1.5 pt-0.5">
                                ${prod.comboServices.map(srv => `
                                    <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold border" style="background-color: rgba(255,255,255,0.04); border-color: var(--border-color);">
                                        ${escapeHtml(srv)}
                                    </span>
                                `).join("")}
                            </div>
                        ` : ""}

                        <!-- Precio grande -->
                        <div class="flex items-baseline gap-1 pt-0.5">
                            <span class="text-2xl sm:text-3xl font-black ${stock === 0 ? 'text-gray-400' : ''}">$${prod.price}</span>
                            <span class="text-xs text-gray-400 font-medium">${escapeHtml(prod.unitLabel || "/ perfil")}</span>
                        </div>

                        <!-- Estado de Stock + Barra de progreso -->
                        <div class="space-y-1.5">
                            <div class="flex items-center justify-between text-xs font-bold">
                                <span class="${statusColor}">• ${statusLabel}</span>
                                <span class="text-gray-400 font-medium">${stock} ${stockUnitWord}</span>
                            </div>
                            <div class="w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
                                <div class="h-full rounded-full ${barColor} transition-all duration-300" style="width: ${pct}%;"></div>
                            </div>
                        </div>

                        <!-- Fila inferior: Selector de cantidad [- 1 +] y Botón Comprar -->
                        ${stock > 0 ? `
                            <div class="flex items-center gap-2.5 pt-1">
                                <div class="flex items-center justify-between rounded-2xl border px-2 py-2 w-28 shrink-0" style="background-color: rgba(255,255,255,0.03); border-color: var(--border-color);">
                                    <button onclick="changeCardQty('${prod.id}', -1, ${stock})" class="w-7 h-7 rounded-lg hover:bg-white/10 flex items-center justify-center font-bold text-gray-400">−</button>
                                    <span class="text-sm font-extrabold">${qty}</span>
                                    <button onclick="changeCardQty('${prod.id}', 1, ${stock})" class="w-7 h-7 rounded-lg hover:bg-white/10 flex items-center justify-center font-bold text-gray-400">+</button>
                                </div>
                                <button onclick="openPurchaseConfirmModal('${prod.id}')" class="btn-primary-pill flex-1 py-3 text-sm font-extrabold text-center shadow">
                                    Comprar
                                </button>
                            </div>
                        ` : `
                            <div class="pt-1">
                                <button disabled class="w-full py-3 rounded-2xl border text-sm font-bold text-gray-500 cursor-not-allowed" style="background-color: rgba(255,255,255,0.02); border-color: var(--border-color);">
                                    Agotado
                                </button>
                            </div>
                        `}

                        <!-- BARRA RÁPIDA DE EDICIÓN (Solo visible para la Administradora) -->
                        ${isAdminUnlocked ? `
                            <div class="mt-3 pt-2.5 border-t border-white/10 flex flex-wrap items-center justify-between gap-1.5 text-xs">
                                ${getProductFieldConfig(prod).deliverAccount !== false ? `
                                    <button onclick="openProductInventoryManager('${prod.id}')" class="flex-1 py-1.5 px-2.5 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-extrabold">
                                        🔑 Cuentas (${stock})
                                    </button>
                                ` : `

        function changeCardQty(prodId, delta, maxStock) {
            const current = cardQuantities[prodId] || 1;
            const next = Math.max(1, Math.min(maxStock, current + delta));
            cardQuantities[prodId] = next;
            renderApp();
        }

            searchQuery = val;
            renderApp();
            const inputs = document.querySelectorAll("input[placeholder='Buscar por nombre o plataforma...']");
            if (inputs.length > 0) {
                const inp = inputs[inputs.length - 1];
                inp.focus();
                inp.setSelectionRange(inp.value.length, inp.value.length);

            selectedCategory = catId;

        /* =========================================================================

        function openPurchaseConfirmModal(prodId) {
            const prod = storeData.products.find(p => p.id === prodId);
            if (!prod) return;

            if (!currentUser) {

                return;

            const isAutoDelivery = fc.deliverAccount !== false;
            const availableAccounts = (prod.inventario || []).filter(a => !a.vendida);
            const maxAvailable = isAutoDelivery ? availableAccounts.length : Math.max(0, Number(prod.stock) || 0);
            const qty = Math.min(cardQuantities[prodId] || 1, maxAvailable);

            if (qty <= 0) {
                showToast("⚠️ Este producto se acaba de agotar.");
                renderApp();
                return;
            }

            const total = Number(prod.price) * qty;
            const userBalance = currentUser ? Number(currentUser.balance || 0) : 0;

            const missing = Math.max(0, total - userBalance);
            const needsClientInput = fc.askClientEmail || fc.askClientPassword || fc.askClientId;

            const modalHtml = `
                <div class="store-card w-full max-w-sm p-6 relative shadow-2xl border border-white/15 max-h-[92vh] overflow-y-auto">

                        ${prod.image ? `<img src="${prod.image}" class="w-full h-full object-cover">` : `<span>${prod.watermarkEmoji || "🎬"}</span>`}
                    </div>

                    <h3 class="text-xl font-black text-center mb-1">Confirmar compra</h3>
                    <p class="text-xs ${isAutoDelivery ? 'text-emerald-400' : 'text-cyan-400'} text-center font-semibold mb-4">

                    </p>

                    <!-- Tabla de desglose -->

                            <span class="text-gray-400">Producto</span>
                            <span class="font-bold text-right">${escapeHtml(prod.name)} · ${(prod.typeBadge || "Perfil").replace(/^[^\w]+/, "")} · ${escapeHtml(prod.durationText || "1 mes")}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-gray-400">Cantidad</span>
                            <span class="font-bold">${qty}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-gray-400">Total</span>
                            <span class="font-black text-base">$${total}</span>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t" style="border-color: var(--border-color);">
                            <span class="text-gray-400">Saldo después</span>
                            <span class="font-black ${balanceAfter < 0 ? 'text-rose-400' : 'text-emerald-400'}">${balanceAfter < 0 ? `-$${Math.abs(balanceAfter)}` : `$${balanceAfter}`}</span>
                        </div>
                    </div>

                    <!-- CAMPOS SOLICITADOS AL CLIENTE (Solo aparecen si la administradora los activó en este artículo, ej. Canva) -->
                    ${needsClientInput ? `
                        <div class="store-card-inner p-3.5 space-y-3 mb-4 border border-cyan-500/30">
                            <div class="text-xs font-extrabold text-cyan-300">
                                ✍️ Datos requeridos para vincular tu servicio:

                            ${fc.askClientEmail ? `
                                <div>
                                    <label class="block text-[11px] font-bold uppercase text-gray-400 mb-1">Tu Correo a vincular *</label>

                            ` : ""}
                            ${fc.askClientPassword ? `
                                <div>
                                    <label class="block text-[11px] font-bold uppercase text-gray-400 mb-1">Contraseña de tu cuenta *</label>
                                    <input type="text" id="client-custom-password" placeholder="Contraseña para sincronizar" class="store-input text-xs" required>
                                </div>

                            ${fc.askClientId ? `
                                <div>
                                    <label class="block text-[11px] font-bold uppercase text-gray-400 mb-1">Tu ID de usuario / jugador *</label>
                                    <input type="text" id="client-custom-id" placeholder="Ingresa tu ID" class="store-input text-xs" required>
                                </div>
                            ` : ""}
                        </div>
                    ` : ""}

                    ${balanceAfter < 0 ? `
                        <div class="p-3.5 rounded-2xl border border-rose-500/30 bg-rose-500/10 text-rose-300 text-xs leading-relaxed mb-4">
                            Te faltan <strong>$${missing}</strong>. Recarga tu saldo y vuelve a intentarlo.
                        </div>
                        <div class="grid grid-cols-2 gap-2.5 mb-2.5">

        function buyViaWhatsApp(prodId, qty, total) {
            const prod = storeData.products.find(p => p.id === prodId);
            if (!prod) return;
            const cEmail = document.getElementById("client-custom-email") ? document.getElementById("client-custom-email").value.trim() : "";
            const cId = document.getElementById("client-custom-id") ? document.getElementById("client-custom-id").value.trim() : "";
            let extra = "";
            if (cEmail) extra += `\n• Correo a vincular: *${cEmail}*`;
            if (cId) extra += `\n• ID: *${cId}*`;
            const msg = `Hola *${storeData.storeName}*, quiero comprar:\n• Producto: *${prod.name}*\n• Cantidad: *${qty}*\n• Total: *$${total}*${extra}`;
            const url = `https://wa.me/${storeData.whatsappNumber.replace(/\D/g, "")}?text=${encodeURIComponent(msg)}`;
            window.open(url, "_blank");
            closeModal();
        }

        function completeBalancePurchase(prodId, qty, total) {
            const prod = storeData.products.find(p => p.id === prodId);
            if (!prod || !currentUser) return;
            if (Number(currentUser.balance) < total) return;

            const fc = getProductFieldConfig(prod);
            const isAutoDelivery = fc.deliverAccount !== false;

            // Validar campos que debe llenar el cliente si están activos para este artículo
            let clientSubmittedEmail = "";
            let clientSubmittedPassword = "";
            let clientSubmittedId = "";

            if (fc.askClientEmail) {
                const el = document.getElementById("client-custom-email");
                clientSubmittedEmail = el ? el.value.trim() : "";
                if (!clientSubmittedEmail) {
                    showToast("⚠️ Por favor escribe el correo donde se vinculará tu cuenta.");
                    if (el) el.focus();
                    return;
                }
            }
            if (fc.askClientPassword) {
                const el = document.getElementById("client-custom-password");
                clientSubmittedPassword = el ? el.value.trim() : "";
                if (!clientSubmittedPassword) {
                    showToast("⚠️ Por favor escribe la contraseña solicitada.");
                    if (el) el.focus();
                    return;
                }
            }
            if (fc.askClientId) {
                const el = document.getElementById("client-custom-id");
                clientSubmittedId = el ? el.value.trim() : "";
                if (!clientSubmittedId) {
                    showToast("⚠️ Por favor escribe el ID solicitado.");
                    if (el) el.focus();
                    return;
                }
            }

            const nowFullStr = new Date().toLocaleString("es-MX", {
                day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"
            });
            const fallbackCodeUrl = prod.codeGeneratorUrl !== undefined ? prod.codeGeneratorUrl : (storeData.defaultCodeGeneratorUrl || DEFAULT_CODE_GENERATOR_URL);

            const deliveredAccounts = [];

            if (isAutoDelivery) {
                if (!Array.isArray(prod.inventario)) prod.inventario = [];
                const availableAccounts = prod.inventario.filter(a => !a.vendida);
                if (availableAccounts.length < qty) {
                    showToast("⚠️ No hay suficientes cuentas disponibles en stock.");
                    closeModal();
                    renderApp();
                    return;
                }

                // Tomar exactamente 'qty' cuentas disponibles y marcarlas como VENDIDAS y BLOQUEADAS para siempre
                for (let i = 0; i < qty; i++) {
                    const acc = availableAccounts[i];
                    acc.vendida = true;
                    acc.comprador = `${currentUser.name} (${currentUser.email})`;
                    acc.fechaEntrega = nowFullStr;
                    deliveredAccounts.push({
                        id: acc.id,
                        correo: acc.correo,
                        password: acc.password,
                        perfil: acc.perfil,
                        accountId: acc.accountId || "",
                        codeGeneratorUrl: acc.codeGeneratorUrl || fallbackCodeUrl
                    });
                }
            } else {
                // Sincronización manual (ej. Canva): descontamos del stock numérico de cupos y no entregamos cuenta precreada
                if ((Number(prod.stock) || 0) < qty) {
                    showToast("⚠️ No hay cupos disponibles en este momento.");
                    closeModal();
                    renderApp();
                    return;
                }
                prod.stock = Math.max(0, Number(prod.stock) - qty);
            }

            // Descontar saldo del cliente y actualizar stock
            currentUser.balance = Number(currentUser.balance) - total;
            currentUser.totalSpent = Number(currentUser.totalSpent || 0) + total;
            syncAllProductsStockWithInventory();
            cardQuantities[prodId] = 1;

            if (!currentUser.purchases) currentUser.purchases = [];
            const purchaseId = "pur_" + Date.now();
            const purchaseRecord = {
                id: purchaseId,
                productId: prod.id,
                productName: prod.name,
                gradStart: prod.gradStart || "#1d4ed8",
                gradEnd: prod.gradEnd || "#172554",
                watermarkEmoji: prod.watermarkEmoji || "🎬",
                qty: qty,
                total: total,
                date: nowFullStr,
                warranty: prod.warrantyText || "30 días de garantía",
                deliveryNote: prod.deliveryNote || "Respeta el perfil asignado.",
                codeGeneratorUrl: fallbackCodeUrl,
                fieldConfig: { ...fc },
                clientInputs: {
                    email: clientSubmittedEmail,
                    password: clientSubmittedPassword,
                    id: clientSubmittedId
                },
                syncStatus: isAutoDelivery ? "Entregada" : "Pendiente de sincronización manual",
                deliveredAccounts: deliveredAccounts
            };
            currentUser.purchases.unshift(purchaseRecord);

            // Si es de sincronización manual o el cliente envió datos, registrar orden para la Administradora y sonar campana
            if (!isAutoDelivery || clientSubmittedEmail || clientSubmittedPassword || clientSubmittedId) {
                if (!storeData.manualSyncOrders) storeData.manualSyncOrders = [];
                storeData.manualSyncOrders.unshift({
                    id: "sync_" + Date.now(),
                    purchaseId: purchaseId,
                    productId: prod.id,
                    productName: prod.name,
                    buyerName: currentUser.name,
                    buyerEmail: currentUser.email,
                    clientEmail: clientSubmittedEmail,
                    clientPassword: clientSubmittedPassword,
                    clientId: clientSubmittedId,
                    qty: qty,
                    total: total,
                    date: nowFullStr,
                    status: "Pendiente"
                });
                playNotificationBellSound();
            }

            if (!currentUser.movements) currentUser.movements = [];
            currentUser.movements.unshift({
                id: "mov_" + Date.now(),
                concept: `Compra: ${prod.name} (x${qty})`,
                date: nowFullStr,
                amount: -total
            });

            // Sincronizar usuario en storeData.users
            const uIdx = storeData.users.findIndex(u => u.email.toLowerCase() === currentUser.email.toLowerCase());
            if (uIdx !== -1) storeData.users[uIdx] = currentUser;

            saveStoreData();
            closeModal();

            // Abrir inmediatamente la PÁGINA DE ENTREGA DE CUENTAS
            openAccountDeliveryPage(purchaseRecord.id);
            showToast(isAutoDelivery ? "🎉 ¡Compra exitosa! Aquí tienes los accesos de tu cuenta." : "✅ ¡Pedido recibido! En breve vinculamos tu cuenta.");
        }

        /* =========================================================================
           12. APARTADO: RECARGAR SALDO (SIN 10% REGALO + NOTIFICACIÓN A ADMIN)

        function renderSectionRecargar() {
            const balance = currentUser ? Number(currentUser.balance || 0) : 0;

                        <div>
                            <h2 class="text-xl font-black mb-1.5">Transferencia con referencia</h2>
                            <p class="text-xs sm:text-sm text-gray-400 leading-relaxed">
                                Te damos un número de 7 dígitos. Lo escribes en el <strong>concepto</strong> de tu transferencia y adjuntas tu captura de pantalla aquí abajo para acreditar tu saldo.
                            </p>

                        <ul class="space-y-1 text-xs text-gray-400">

                            <li class="flex items-center gap-2"><span class="text-emerald-400 font-bold">✓</span> Disponible las 24 horas</li>
                            <li class="flex items-center gap-2"><span class="text-emerald-400 font-bold">✓</span> Recargas de $${b.minAmount || 20} a $${b.maxAmount || 5000}</li>

                        <!-- PASO 1: DATOS BANCARIOS Y CÓDIGO DE REFERENCIA PARA EL CONCEPTO -->
                        <div class="store-card-inner p-4 space-y-3 border border-white/10">
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-extrabold uppercase tracking-wider text-gray-400">1. Datos para tu Transferencia SPEI</span>
                                <button onclick="copyTextToClipboard('${escapeHtml(b.clabe)}', '📋 CLABE copiada')" class="text-xs font-bold text-emerald-400 hover:underline">📋 Copiar CLABE</button>
                            </div>
                            <div class="space-y-1.5 text-xs">
                                <div class="flex justify-between"><span class="text-gray-400">Banco:</span><span class="font-bold">${escapeHtml(b.bankName)}</span></div>
                                <div class="flex justify-between"><span class="text-gray-400">Beneficiario:</span><span class="font-bold">${escapeHtml(b.beneficiary)}</span></div>
                                <div class="flex justify-between"><span class="text-gray-400">CLABE:</span><span class="font-mono font-bold">${escapeHtml(b.clabe)}</span></div>
                                ${b.cardNumber ? `<div class="flex justify-between"><span class="text-gray-400">Tarjeta / Cuenta:</span><span class="font-mono font-bold">${escapeHtml(b.cardNumber)}</span></div>` : ""}
                            </div>

                            <!-- CAJA DESTACADA DEL CÓDIGO DE REFERENCIA DE 7 DÍGITOS -->
                            <div class="pt-3 border-t border-white/10">
                                <div class="text-[11px] font-bold uppercase tracking-wider text-amber-400 mb-1.5">
                                    📌 Pon este código de referencia en el CONCEPTO de tu transferencia:
                                </div>
                                <div class="flex items-center justify-between gap-2 p-3 rounded-xl bg-black/40 border border-amber-400/40">
                                    <div>
                                        <div class="text-[10px] text-gray-400 uppercase">Concepto / Referencia (7 dígitos)</div>
                                        <div class="text-2xl font-black tracking-widest text-amber-400 font-mono">${activeReferenceCode}</div>
                                    </div>
                                    <div class="flex items-center gap-1.5">
                                        <button type="button" onclick="copyTextToClipboard('${activeReferenceCode}', '📋 Código de referencia copiado')" class="px-3 py-2 rounded-xl bg-amber-400 text-black font-extrabold text-xs shadow">
                                            📋 Copiar
                                        </button>
                                        <button type="button" onclick="regenerateReferenceCode()" title="Generar otro código" class="px-2.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold">
                                            🔄
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- PASO 2: MONTO EXACTO DE LA RECARGA (SIN BONO DEL 10%) -->
                        <div class="store-card-inner p-4 space-y-3 border border-white/10">
                            <label class="block text-[11px] font-extrabold uppercase tracking-wider text-gray-400">
                                2. ¿Cuánto transferiste? ($${b.minAmount || 20} a $${b.maxAmount || 5000})
                            </label>
                            <div class="flex flex-wrap gap-1.5">
                                ${[20, 50, 100, 200, 500].map(preset => `
                                    <button type="button" onclick="setRechargeAmount(${preset})" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold border transition ${Number(rechargeAmountInput) === preset ? 'bg-white text-black border-white' : 'bg-white/5 text-gray-400 border-white/10 hover:bg-white/10'}">
                                        $${preset}
                                    </button>
                                `).join("")}
                            </div>
                            <div class="relative">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 font-black text-gray-400">$</span>
                                <input
                                    type="number"
                                    min="${b.minAmount || 20}"
                                    max="${b.maxAmount || 5000}"
                                    value="${rechargeAmountInput}"
                                    oninput="handleRechargeAmountInput(this.value)"
                                    class="store-input pl-9 font-black text-lg"
                                    placeholder="50"
                                >
                            </div>
                            <div id="recharge-exact-summary" class="text-xs flex items-center justify-between px-3 py-2 rounded-xl bg-emerald-500/10 border border-emerald-500/25 text-emerald-400">
                                <span>Monto a recargar en tu cuenta:</span>
                                <span class="font-black text-sm">$${amt}</span>
                            </div>
                        </div>

                        <!-- PASO 3: SUBIR CAPTURA DE PANTALLA DE LA TRANSFERENCIA -->
                        <div class="store-card-inner p-4 space-y-3 border border-white/10">
                            <label class="block text-[11px] font-extrabold uppercase tracking-wider text-gray-400">
                                3. Sube la captura de pantalla de tu transferencia
                            </label>

                            <label class="block border-2 border-dashed rounded-2xl p-4 text-center cursor-pointer transition ${uploadedReceiptDataUrl ? 'border-emerald-400/60 bg-emerald-500/5' : 'border-white/20 hover:border-white/40 bg-white/[0.02]'}">
                                <input type="file" accept="image/*" class="hidden" onchange="handleRechargeScreenshotUpload(this)">
                                ${uploadedReceiptDataUrl ? `
                                    <div class="space-y-2">
                                        <img src="${uploadedReceiptDataUrl}" class="max-h-48 mx-auto rounded-xl object-contain border border-white/15 shadow-lg" alt="Comprobante">
                                        <div class="text-xs font-bold text-emerald-400">✅ Comprobante cargado (${escapeHtml(uploadedReceiptFileName || 'captura.jpg')})</div>
                                        <div class="text-[11px] text-gray-400 underline">Toca aquí si deseas cambiar la imagen</div>
                                    </div>
                                ` : `
                                    <div class="py-3 space-y-1.5">
                                        <div class="text-3xl">📸</div>
                                        <div class="text-xs sm:text-sm font-extrabold">Toca aquí para subir tu captura de transferencia</div>
                                        <div class="text-[11px] text-gray-400">Selecciona la imagen desde tu galería</div>
                                    </div>
                                `}
                            </label>
                        </div>

                        <!-- PASO 4: BOTÓN PARA ENVIAR COMPROBANTE Y NOTIFICAR A LA ADMINISTRADORA -->
                        <button
                            type="button"
                            onclick="submitRechargeWithNotification()"
                            ${isProcessingRecharge ? 'disabled' : ''}
                            class="btn-primary-pill w-full py-4 px-5 text-sm sm:text-base font-black shadow-xl flex items-center justify-center gap-2"
                        >
                            ${isProcessingRecharge ? `
                                <span class="inline-block w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></span>
                                <span>Enviando notificación y captura (Ref. ${activeReferenceCode})...</span>
                            ` : `
                                <span>📤</span>
                                <span>Enviar Captura para Recargar $${amt}</span>
                            `}
                        </button>
                    </div>

                    <!-- Tarjeta 2: Recargar por WhatsApp -->
                    <div class="store-card p-5 space-y-3">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border text-gray-400" style="background-color: rgba(255,255,255,0.04); border-color: var(--border-color);">
                            💬 Con el vendedor
                        </span>
                        <h2 class="text-xl font-black">Recargar por WhatsApp</h2>
                        <p class="text-xs sm:text-sm text-gray-400 leading-relaxed">
                            Escríbele directo al vendedor, haz tu pago como siempre y mándale tu comprobante. Él te abona el saldo.
                        </p>
                        <button onclick="openRechargeWhatsApp()" class="btn-secondary-pill px-5 py-3 text-sm font-bold">
                            Abrir WhatsApp
                        </button>
                    </div>

                    <!-- Tarjeta 3: Historial de Mis recargas -->
                    <div class="store-card p-5">
                        <h3 class="text-base font-extrabold mb-4">Mis solicitudes de recarga</h3>
                        ${refs.length === 0 ? `
                            <div class="text-center py-6">
                                <div class="text-4xl mb-2">💳</div>
                                <div class="font-bold text-sm">Sin recargas registradas</div>
                                <p class="text-xs text-gray-400 mt-1">Cuando envíes tu referencia y captura verás aquí su estado.</p>
                            </div>
                        ` : `
                            <div class="space-y-2.5">
                                ${refs.map(r => `
                                    <div class="store-card-inner p-3.5 flex items-center justify-between gap-3 text-xs">
                                        <div class="flex items-center gap-3 min-w-0">
                                            ${r.receiptImg ? `
                                                <img src="${r.receiptImg}" onclick="previewReceiptModal('${r.id}')" class="w-11 h-11 rounded-lg object-cover border border-white/15 cursor-pointer shrink-0" title="Ver captura">
                                            ` : `
                                                <div class="w-11 h-11 rounded-lg bg-white/5 flex items-center justify-center text-lg shrink-0">💳</div>
                                            `}
                                            <div class="min-w-0">
                                                <div class="font-black text-sm text-amber-400">Concepto: ${escapeHtml(r.code)}</div>
                                                <div class="font-bold">Monto: $${r.amount || 0}</div>
                                                <div class="text-gray-500 text-[11px]">${escapeHtml(r.date)}</div>
                                            </div>
                                        </div>
                                        <span class="px-2.5 py-1 rounded-full font-bold shrink-0 ${r.status === 'Aprobada' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : (r.status === 'Rechazada' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30')}">
                                            ${r.status === 'Aprobada' ? '✓ Saldo Abonado' : (r.status === 'Rechazada' ? '✕ Rechazada' : '⏳ Pendiente')}
                                        </span>
                                    </div>
                                `).join("")}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function regenerateReferenceCode() {
            activeReferenceCode = generateNew7DigitCode();
            renderApp();
            showToast("🔄 Nuevo código de referencia generado");
        }

        function setRechargeAmount(val) {
            rechargeAmountInput = val;
            renderApp();
        }

        function handleRechargeAmountInput(val) {
            rechargeAmountInput = val;
            const amt = Number(val) || 0;
            const summaryEl = document.getElementById("recharge-exact-summary");
            if (summaryEl) {
                summaryEl.innerHTML = `
                    <span>Monto a recargar en tu cuenta:</span>
                    <span class="font-black text-sm">$${amt}</span>
                `;
            }
        }

        async function handleRechargeScreenshotUpload(input) {
            if (!input.files || !input.files[0]) return;
            try {
                const file = input.files[0];
                uploadedReceiptFileName = file.name;
                uploadedReceiptDataUrl = await compressImageFromFile(file, 850, 0.78);
                renderApp();
                showToast("📸 Captura de transferencia cargada correctamente");
            } catch (err) {
                showToast("⚠️ No se pudo leer la imagen, intenta con otra captura.");
            }
        }

        function submitRechargeWithNotification() {
            if (!currentUser) {
                showToast("🔑 Crea tu cuenta o inicia sesión primero para recargar saldo");
                openAuthModal("register");
                return;
            }

            const b = storeData.bankInfo || INITIAL_STORE_DATA.bankInfo;
            const minAmt = Number(b.minAmount) || 20;
            const maxAmt = Number(b.maxAmount) || 5000;
            const amt = Number(rechargeAmountInput) || 0;

            if (amt < minAmt || amt > maxAmt) {
                showToast(`⚠️ Ingresa un monto válido entre $${minAmt} y $${maxAmt}`);
                return;
            }

            if (!uploadedReceiptDataUrl) {
                showToast("📸 Por favor sube la captura de pantalla de tu transferencia primero");
                return;
            }

            isProcessingRecharge = true;
            renderApp();

            setTimeout(() => {
                isProcessingRecharge = false;
                const nowStr = new Date().toLocaleString("es-MX", {
                    day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
                });

                const autoApprove = b.autoApproveRecharges === true;
                const reqId = "rec_" + Date.now();
                const refCodeUsed = activeReferenceCode;

                const record = {
                    id: reqId,
                    code: refCodeUsed,
                    userEmail: currentUser.email,
                    userName: currentUser.name,
                    amount: amt,
                    totalCredited: amt,
                    date: nowStr,
                    status: autoApprove ? "Aprobada" : "Pendiente",
                    receiptImg: uploadedReceiptDataUrl
                };

                if (!storeData.rechargeRequests) storeData.rechargeRequests = [];
                storeData.rechargeRequests.unshift(record);

                // Crear notificación inmediata para la Administradora
                if (!storeData.adminNotifications) storeData.adminNotifications = [];
                storeData.adminNotifications.unshift({
                    id: "notif_" + Date.now(),
                    title: `🔔 Nueva recarga de $${amt} (${currentUser.name})`,
                    message: `Concepto Ref: ${refCodeUsed} · Correo: ${currentUser.email}`,
                    date: nowStr,
                    rechargeId: reqId
                });

                if (!currentUser.references) currentUser.references = [];
                currentUser.references.unshift(record);

                if (autoApprove) {
                    currentUser.balance = Number(currentUser.balance || 0) + amt;
                    if (!currentUser.movements) currentUser.movements = [];
                    currentUser.movements.unshift({
                        id: "mov_" + Date.now(),
                        concept: `Recarga SPEI (Ref. ${refCodeUsed})`,
                        date: nowStr,
                        amount: amt
                    });
                }

                // Sincronizar en storeData.users
                const uIdx = storeData.users.findIndex(u => u.email.toLowerCase() === currentUser.email.toLowerCase());
                if (uIdx !== -1) storeData.users[uIdx] = currentUser;

                // Limpiar captura y generar nuevo código para la próxima recarga
                uploadedReceiptDataUrl = "";
                uploadedReceiptFileName = "";
                activeReferenceCode = generateNew7DigitCode();

                saveStoreData();
                playNotificationBellSound();
                renderApp();

                // Intentar enviar notificación del navegador si está permitida
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification(`🔔 Recarga de $${amt} recibida`, {
                        body: `Cliente: ${currentUser.name} · Ref: ${refCodeUsed}`
                    });
                }

                // Mostrar modal de confirmación de solicitud enviada
                openRechargeSubmittedModal(record);
            }, 900);
        }

        function openRechargeSubmittedModal(record) {
            const waMsg = `Hola *${storeData.storeName}*, acabo de subir mi comprobante de recarga en la página:\n• Cliente: *${record.userName}* (${record.userEmail})\n• Monto: *$${record.amount}*\n• Concepto / Referencia: *${record.code}*`;
            const waUrl = `https://wa.me/${storeData.whatsappNumber.replace(/\D/g, "")}?text=${encodeURIComponent(waMsg)}`;

            const modalHtml = `
                <div class="store-card w-full max-w-sm p-6 relative shadow-2xl border border-emerald-500/40 text-center space-y-4">
                    <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-gray-400">✕</button>
                    <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 mx-auto flex items-center justify-center text-3xl">🔔</div>
                    <h3 class="text-xl font-black">¡Notificación Enviada!</h3>
                    <p class="text-xs text-gray-300 leading-relaxed">
                        Tu captura por <strong>$${record.amount}</strong> con referencia <strong>${escapeHtml(record.code)}</strong> ya fue notificada a la administradora para abonarte el saldo.
                    </p>
                    <div class="space-y-2 pt-1">
                        <a href="${waUrl}" target="_blank" onclick="closeModal()" class="w-full py-3 px-4 rounded-2xl bg-emerald-500 text-black font-black text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg">
                            <span>💬</span>
                            <span>Avisar también por WhatsApp (Opcional)</span>
                        </a>
                        <button onclick="closeModal()" class="btn-secondary-pill w-full py-3 text-xs sm:text-sm font-bold">
                            Entendido
                        </button>
                    </div>
                </div>
            `;
            showModal(modalHtml);
        }

        function previewReceiptModal(recId) {
            const allReqs = (storeData.rechargeRequests || []).concat(currentUser && currentUser.references ? currentUser.references : []);
            const found = allReqs.find(r => r.id === recId);

        function fillReportFromPurchase(purId) {
            if (!purId || !currentUser || !Array.isArray(currentUser.purchases)) return;
            const pur = currentUser.purchases.find(p => p.id === purId);
            if (!pur) return;
            const emailEl = document.getElementById("rep-email");
            const passEl = document.getElementById("rep-pass");
            const srvEl = document.getElementById("rep-service");

            if (srvEl) srvEl.value = pur.productName;
            if (pur.deliveredAccounts && pur.deliveredAccounts[0]) {
                if (emailEl) emailEl.value = pur.deliveredAccounts[0].correo || "";
                if (passEl) passEl.value = pur.deliveredAccounts[0].password || "";
            } else if (pur.clientInputs && pur.clientInputs.email) {
                if (emailEl) emailEl.value = pur.clientInputs.email;
                if (passEl) passEl.value = pur.clientInputs.password || "Sincronización manual";
            }
        }
